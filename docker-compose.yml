version: "3.9"
services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp
      - MODEL_DIR=/app/models
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: ./monitoring
    ports:
      - "8050:8050"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped

  orchestrator:
    build: ./orchestration
    environment:
      - NEWS_API_KEY=${NEWS_API_KEY:-dummy_key}
      - PREFECT_API_URL=http://127.0.0.1:4200/api
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - api
